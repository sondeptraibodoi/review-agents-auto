name: Tests
on:
  push:
  pull_request:
jobs:
  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[all]'
      - run: python -m unittest tests.test_ai tests.test_core tests.test_ui tests.test_vision tests.test_db tests.test_api tests.test_backend tests.test_cli_integration -v
  browser-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[ui]'
      - run: python -m playwright install chromium
      - run: python -m unittest discover -s tests -p 'test_browser*.py' -v
