[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-review-agents"
version = "0.4.0"
description = "Cross-platform diff-first code reviewer and local visual UI review toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Lean Review Agents contributors"}]

[project.optional-dependencies]
ui = ["playwright>=1.49,<2", "Pillow>=10,<13"]
postgres = ["psycopg[binary]>=3.1,<4"]
mysql = ["PyMySQL>=1.1,<2"]
db = ["psycopg[binary]>=3.1,<4", "PyMySQL>=1.1,<2"]
all = ["playwright>=1.49,<2", "Pillow>=10,<13", "psycopg[binary]>=3.1,<4", "PyMySQL>=1.1,<2"]

[project.scripts]
leanreview = "leanreview.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The default installation remains dependency-free. Database drivers are opt-in.
